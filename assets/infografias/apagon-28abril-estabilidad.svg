<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia del gran apagón peninsular del 28 de abril de 2025</title>
  <desc id="desc">Infografía que resume la secuencia oficial: oscilaciones, subida de tensión, desconexiones de generación y colapso; explica que no fue un problema de falta de inercia y destaca las necesidades de control dinámico de tensión, protección ante oscilaciones, almacenamiento, demanda flexible e interconexiones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13372f"/>
      <stop offset="1" stop-color="#081d1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#00100d" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4c552"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="26" fill="url(#bg)"/>
  <path d="M0 118 C210 82 350 150 560 112 S940 76 1200 122" fill="none" stroke="#3b7568" stroke-width="2" opacity=".5"/>
  <text x="54" y="61" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="800">El gran apagón: una crisis de estabilidad, no de energía disponible</text>
  <text x="54" y="94" fill="#c7ded8" font-family="Arial, sans-serif" font-size="16">Secuencia oficial del cero eléctrico peninsular · 28 de abril de 2025</text>

  <g filter="url(#shadow)">
    <rect x="54" y="142" width="246" height="190" rx="16" fill="#f7fbfa"/>
    <rect x="327" y="142" width="246" height="190" rx="16" fill="#f7fbfa"/>
    <rect x="600" y="142" width="246" height="190" rx="16" fill="#f7fbfa"/>
    <rect x="873" y="142" width="273" height="190" rx="16" fill="#fff6e7"/>
  </g>
  <line x1="300" y1="237" x2="322" y2="237" stroke="#f4c552" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="573" y1="237" x2="595" y2="237" stroke="#f4c552" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="846" y1="237" x2="868" y2="237" stroke="#f4c552" stroke-width="4" marker-end="url(#arrow)"/>

  <circle cx="88" cy="177" r="17" fill="#247ba0"/><text x="88" y="183" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="800">1</text>
  <text x="116" y="183" fill="#143b32" font-family="Arial" font-size="18" font-weight="800">Oscilaciones</text>
  <text x="78" y="222" fill="#405f57" font-family="Arial" font-size="15">
    <tspan x="78" dy="0">Desde las 12:03 se registran</tspan><tspan x="78" dy="24">oscilaciones que provocan</tspan><tspan x="78" dy="24">fluctuaciones de tensión.</tspan>
  </text>
  <text x="78" y="303" fill="#247ba0" font-family="Arial" font-size="14" font-weight="700">12:03–12:30</text>

  <circle cx="361" cy="177" r="17" fill="#7b6aa8"/><text x="361" y="183" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="800">2</text>
  <text x="389" y="183" fill="#143b32" font-family="Arial" font-size="18" font-weight="800">Sube la tensión</text>
  <text x="351" y="222" fill="#405f57" font-family="Arial" font-size="15">
    <tspan x="351" dy="0">La respuesta aplicada amortigua</tspan><tspan x="351" dy="24">las oscilaciones, pero aumenta</tspan><tspan x="351" dy="24">la tensión de la red.</tspan>
  </text>
  <text x="351" y="303" fill="#7b6aa8" font-family="Arial" font-size="14" font-weight="700">Control dinámico insuficiente</text>

  <circle cx="634" cy="177" r="17" fill="#d98b2b"/><text x="634" y="183" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="800">3</text>
  <text x="662" y="183" fill="#143b32" font-family="Arial" font-size="18" font-weight="800">Desconexiones</text>
  <text x="624" y="222" fill="#405f57" font-family="Arial" font-size="15">
    <tspan x="624" dy="0">Varias plantas se desconectan;</tspan><tspan x="624" dy="24">cada salida eleva más la tensión</tspan><tspan x="624" dy="24">y acelera la reacción en cadena.</tspan>
  </text>
  <text x="624" y="303" fill="#b96611" font-family="Arial" font-size="14" font-weight="700">12:32:57–12:33:18</text>

  <circle cx="907" cy="177" r="17" fill="#b84b4b"/><text x="907" y="183" text-anchor="middle" fill="#fff" font-family="Arial" font-size="17" font-weight="800">4</text>
  <text x="935" y="183" fill="#4c2626" font-family="Arial" font-size="18" font-weight="800">Colapso peninsular</text>
  <text x="897" y="222" fill="#66524c" font-family="Arial" font-size="15">
    <tspan x="897" dy="0">Caen frecuencia y sincronismo</tspan><tspan x="897" dy="24">con Francia. En segundos se</tspan><tspan x="897" dy="24">produce el cero eléctrico.</tspan>
  </text>
  <text x="897" y="303" fill="#a63f3f" font-family="Arial" font-size="14" font-weight="700">12:33:18–12:33:30</text>

  <rect x="54" y="366" width="1092" height="70" rx="14" fill="#224c42" stroke="#4f8276"/>
  <text x="78" y="397" fill="#f4c552" font-family="Arial" font-size="17" font-weight="800">La clave:</text>
  <text x="165" y="397" fill="#fff" font-family="Arial" font-size="17" font-weight="700">no fue una falta de inercia.</text>
  <text x="78" y="422" fill="#d2e4df" font-family="Arial" font-size="15">Los informes oficiales sitúan el origen en la sobretensión, las oscilaciones y una respuesta insuficiente o incorrecta de parte de la generación.</text>

  <g font-family="Arial" font-size="15">
    <circle cx="74" cy="482" r="8" fill="#60b56a"/><text x="92" y="488" fill="#fff" font-weight="700">Control dinámico de tensión en toda la generación</text>
    <circle cx="481" cy="482" r="8" fill="#60b56a"/><text x="499" y="488" fill="#fff" font-weight="700">Protección frente a oscilaciones y desconexiones</text>
    <circle cx="882" cy="482" r="8" fill="#60b56a"/><text x="900" y="488" fill="#fff" font-weight="700">Más flexibilidad y observabilidad</text>
  </g>
  <text x="54" y="535" fill="#9fc0b8" font-family="Arial" font-size="12">Síntesis gráfica propia a partir de MITECO (2025) y Red Eléctrica (2025).</text>
</svg>
