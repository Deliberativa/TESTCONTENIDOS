<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">¿Cuánta tierra agraria podría ocupar la energía solar?</title>
  <desc id="desc">Tres cuadrículas proporcionales comparan la ocupación solar existente, la existente más aprobada y el desarrollo completo del potencial solar del PTS con la superficie agraria útil de Euskadi.</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1"><stop stop-color="#009b7a"/><stop offset="1" stop-color="#cddd23"/></linearGradient>
    <pattern id="grid" width="40" height="18" patternUnits="userSpaceOnUse"><rect x=".5" y=".5" width="39" height="17" rx="1.8" fill="#fbfdfc" stroke="#183f37" stroke-opacity=".18"/></pattern>
    <pattern id="ptsHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#d6a51a" fill-opacity=".23"/><rect width="3.5" height="12" fill="#d6a51a"/></pattern>
    <clipPath id="grid1"><rect x="108" y="408" width="400" height="180" rx="4"/></clipPath>
    <clipPath id="grid2"><rect x="600" y="408" width="400" height="180" rx="4"/></clipPath>
    <clipPath id="grid3"><rect x="1092" y="408" width="400" height="180" rx="4"/></clipPath>
    <style>.title{font-family:Arial,"Helvetica Neue",sans-serif;font-weight:800;fill:#183f37}.text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#183f37}.muted{fill:#557169}</style>
  </defs>
  <rect width="1600" height="940" fill="#fbfdfc"/><rect width="1600" height="12" fill="url(#topLine)"/>
  <text class="title" x="80" y="85" font-size="43">¿Cuánta tierra agraria podría ocupar la energía solar?</text>
  <text class="text muted" x="82" y="128" font-size="22">Tres momentos comparados con las 177.011 hectáreas de superficie agraria útil de Euskadi.</text>
  <rect x="1290" y="55" width="230" height="42" rx="21" fill="#e7f4ef"/><text x="1405" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750" letter-spacing="1.4" fill="#007b65">ENERGÍA · TERRITORIO</text>

  <rect x="80" y="190" width="456" height="472" rx="20" fill="#fff" stroke="#cfe3dc" stroke-width="2"/>
  <text class="text" x="108" y="231" font-size="16" font-weight="800" letter-spacing="1.2" fill="#007b65">AHORA</text><text class="title" x="108" y="278" font-size="28">Instalaciones existentes</text>
  <text class="title" x="108" y="347" font-size="52">0,06 %</text><text class="text muted" x="108" y="378" font-size="19">≈ 103 ha agrarias</text>
  <g clip-path="url(#grid1)"><rect x="108" y="408" width="400" height="180" fill="url(#grid)"/><rect x="108" y="408" width="2.4" height="18" fill="#183f37"/></g>
  <rect x="108" y="408" width="400" height="180" rx="4" fill="none" stroke="#183f37" stroke-width="1.8"/><path d="M110.4 408 C125 390 143 382 164 374" fill="none" stroke="#183f37" stroke-width="2"/><circle cx="110.4" cy="408" r="3.5" fill="#183f37"/>
  <text class="text muted" x="108" y="621" font-size="15">100 casillas = 100 % de la SAU</text>

  <rect x="572" y="190" width="456" height="472" rx="20" fill="#fff" stroke="#cfe3dc" stroke-width="2"/>
  <text class="text" x="600" y="231" font-size="16" font-weight="800" letter-spacing="1.2" fill="#2d7792">EN MARCHA</text><text class="title" x="600" y="278" font-size="28">Existentes + aprobadas</text>
  <text class="title" x="600" y="347" font-size="52">0,22 %</text><text class="text muted" x="600" y="378" font-size="19">≈ 394 ha agrarias</text>
  <g clip-path="url(#grid2)"><rect x="600" y="408" width="400" height="180" fill="url(#grid)"/><rect x="600" y="408" width="8.8" height="18" fill="#2d7792"/></g>
  <rect x="600" y="408" width="400" height="180" rx="4" fill="none" stroke="#183f37" stroke-width="1.8"/><path d="M608.8 408 C625 390 643 382 664 374" fill="none" stroke="#2d7792" stroke-width="2"/><circle cx="608.8" cy="408" r="3.5" fill="#2d7792"/>
  <text class="text muted" x="600" y="621" font-size="15">100 casillas = 100 % de la SAU</text>

  <rect x="1064" y="190" width="456" height="472" rx="20" fill="#fff" stroke="#d7bd76" stroke-width="2"/>
  <text class="text" x="1092" y="231" font-size="16" font-weight="800" letter-spacing="1.2" fill="#8b6920">ESCENARIO MÁXIMO</text><text class="title" x="1092" y="278" font-size="28">Todo el potencial solar del PTS</text>
  <text class="title" x="1092" y="347" font-size="52">1,4–1,5 %</text><text class="text muted" x="1092" y="378" font-size="19">≈ 2.490–2.640 ha agrarias</text>
  <g clip-path="url(#grid3)"><rect x="1092" y="408" width="400" height="180" fill="url(#grid)"/><rect x="1092" y="408" width="58" height="18" fill="url(#ptsHatch)"/><rect x="1092" y="408" width="66.4" height="18" fill="none" stroke="#d6a51a" stroke-width="2" stroke-dasharray="4 4"/></g>
  <rect x="1092" y="408" width="400" height="180" rx="4" fill="none" stroke="#183f37" stroke-width="1.8"/><text class="text muted" x="1092" y="621" font-size="15">100 casillas = 100 % de la SAU</text><text class="text" x="1092" y="644" font-size="14" fill="#8b6920">Línea discontinua: máximo teórico del 1,66 %</text>

  <rect x="80" y="704" width="1440" height="96" rx="18" fill="#e7f4ef"/><circle cx="132" cy="752" r="29" fill="#007b65"/><text x="132" y="761" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#fff">×25</text>
  <text class="title" x="183" y="742" font-size="23">El desarrollo completo del potencial solar del PTS ocuparía unas 25 veces la superficie agraria actual.</text>
  <text class="text muted" x="183" y="774" font-size="17">Seguiría siendo alrededor del 1,5 % de la SAU vasca, aunque la concentración local puede hacer más relevante su impacto.</text>

  <line x1="80" y1="828" x2="1520" y2="828" stroke="#cfe3dc"/>
  <text class="text muted" x="80" y="852" font-size="13.5"><tspan font-weight="700">Método.</tspan> Porcentaje = superficie agraria estimada ÷ 177.011 ha × 100. Existentes: 116,9 ha equivalentes × 88 % agrario ≈ 103 ha.</text>
  <text class="text muted" x="80" y="874" font-size="13.5">Existentes + aprobadas: 457,9 ha × 86 % agrario ≈ 394 ha. PTS: 2.930,9 ha de ZLS solares × 85–90 % agrario = 2.490–2.640 ha. El 1,66 % supone que toda la ZLS fuera agraria.</text>
  <text class="text muted" x="80" y="896" font-size="13.5"><tspan font-weight="700">Fuentes.</tspan> Eustat, Encuesta sobre la estructura de las explotaciones agrarias 2023; Gobierno Vasco, PTS de Energías Renovables, memoria y cartografía para aprobación definitiva (2026).</text>
  <text class="text muted" x="80" y="918" font-size="13">Las áreas existentes y aprobadas proceden del mapa de instalaciones y de sus expedientes; las ZLS son potencial territorial, no proyectos comprometidos.</text>
</svg>
